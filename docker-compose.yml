services:
  backend:
    build:
      context: .
    container_name: quizmania-backend
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "replace-with-a-long-random-string"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DJANGO_CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:5173"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost"
      PORT: "8000"
    networks:
      - quizmania

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: "/api"
        VITE_SITE_URL: "http://localhost"
    container_name: quizmania-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - quizmania

networks:
  quizmania:
    driver: bridge
