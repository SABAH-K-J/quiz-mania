name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Django checks
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "ci-only-secret-key-not-for-production"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_SECURE_SSL_REDIRECT: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy || python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --verbosity 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      VITE_API_URL: "https://example.onrender.com/api"
      VITE_SITE_URL: "https://example.vercel.app"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
